<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM Desk — Кабинет сотрудника</title>
<style>
  :root{
    --bg:#0b0f17;
    --panel:#121826;
    --panel-2:#171f30;
    --panel-3:#1c2538;
    --border:#26304a;
    --text:#eef1f7;
    --text-dim:#8993ab;
    --text-faint:#5c6685;
    --accent:#5b8cff;
    --accent-dim:#2d3f6b;
    --tg:#4f9dff;
    --wa:#33c17a;
    --max:#a672f2;
    --success:#33c17a;
    --warning:#f0b94d;
    --danger:#ef5c72;
    --mono: 'SF Mono', 'Roboto Mono', ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .hidden{display:none !important;}

  ::selection{background:var(--accent-dim);}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input, select{font-family:inherit;}

  .eyebrow{
    text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;
    color:var(--text-faint);
  }

  /* ---------- LOGIN ---------- */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(91,140,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(166,114,242,0.10), transparent 40%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:36px 32px;
  }
  .login-mark{
    width:44px;height:30px;border-radius:6px;
    background:linear-gradient(135deg,#d8c98a,#a9924e);
    position:relative;margin-bottom:20px;
    clip-path:polygon(0 0, 78% 0, 100% 30%, 100% 100%, 0 100%);
  }
  .login-mark::after{
    content:"";position:absolute;inset:6px;border-radius:3px;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 1px, transparent 1px 5px);
  }
  h1.login-title{font-size:22px;margin:0 0 4px;letter-spacing:-0.01em;}
  .login-sub{color:var(--text-dim);font-size:13px;margin:0 0 28px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;background:var(--panel-3);border:1px solid var(--border);
    border-radius:9px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 18px;border-radius:9px;border:1px solid transparent;
    font-size:14px;font-weight:600;transition:filter .15s, transform .05s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:6px;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim);}
  .btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:rgba(239,92,114,0.1);}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .icon-btn{
    width:28px;height:28px;padding:0;border-radius:7px;background:transparent;border:1px solid var(--border);
    color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;font-size:13px;
  }
  .icon-btn:hover{border-color:var(--text-dim);color:var(--text);}
  .icon-btn.danger-hover:hover{border-color:var(--danger);color:var(--danger);}
  .row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .role-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;}
  .role-pill.admin{background:rgba(240,185,77,0.14);color:var(--warning);}
  .role-pill.operator{background:rgba(91,140,255,0.14);color:var(--accent);}
  .role-pill.viewer{background:rgba(139,148,171,0.16);color:var(--text-dim);}
  .quota-bar{font-size:12.5px;color:var(--text-dim);margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;}
  .quota-bar b{color:var(--text);}
  .quota-pill{background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;}
  .login-error{
    background:rgba(239,92,114,0.1);border:1px solid rgba(239,92,114,0.3);color:#ff9aac;
    padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:12px;
  }
  .login-hint{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint);line-height:1.6;}

  /* ---------- SHELL ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-0.01em;font-size:15px;}
  .brand .chip{width:20px;height:14px;border-radius:3px;background:linear-gradient(135deg,#d8c98a,#a9924e);clip-path:polygon(0 0, 78% 0, 100% 30%, 100% 100%, 0 100%);}
  .who{display:flex;align-items:center;gap:12px;}
  .who .name{font-size:13.5px;color:var(--text-dim);}
  .who .role-badge{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    padding:3px 8px;border-radius:5px;background:var(--panel-3);color:var(--text-dim);border:1px solid var(--border);
  }

  .main{flex:1;padding:26px 24px 60px;max-width:1180px;width:100%;margin:0 auto;}

  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);}
  .tab{
    padding:10px 16px;font-size:13.5px;color:var(--text-dim);border-bottom:2px solid transparent;
    font-weight:600;transition:color .15s;
  }
  .tab.active{color:var(--text);border-color:var(--accent);}
  .tab:hover{color:var(--text);}

  .section-title{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .section-sub{font-size:13px;color:var(--text-dim);margin:0 0 18px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:720px){ .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:repeat(2,1fr);} }

  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat-num{font-size:26px;font-weight:800;letter-spacing:-0.02em;}
  .stat-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

  /* type badges */
  .tbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .tbadge.telegram{background:rgba(79,157,255,0.14);color:var(--tg);}
  .tbadge.whatsapp{background:rgba(51,193,122,0.14);color:var(--wa);}
  .tbadge.max{background:rgba(166,114,242,0.14);color:var(--max);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .sbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .sbadge.available{background:rgba(139,148,171,0.14);color:var(--text-dim);}
  .sbadge.assigned{background:rgba(51,193,122,0.14);color:var(--success);}
  .sbadge.blocked{background:rgba(239,92,114,0.14);color:var(--danger);}
  .sbadge.temp_blocked{background:rgba(240,185,77,0.14);color:var(--warning);}

  .bell-wrap{position:relative;}
  .bell-btn{
    position:relative;width:32px;height:32px;padding:0;border-radius:8px;background:transparent;
    border:1px solid var(--border);color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;font-size:15px;
  }
  .bell-btn:hover{border-color:var(--text-dim);color:var(--text);}
  .bell-badge{
    position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
    min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .bell-dropdown{
    position:absolute;top:38px;right:0;width:320px;max-height:400px;overflow-y:auto;
    background:var(--panel-3);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);z-index:50;padding:8px;
  }
  .bell-item{padding:10px 10px;border-radius:8px;font-size:12.5px;line-height:1.5;}
  .bell-item.unread{background:rgba(91,140,255,0.08);}
  .bell-item + .bell-item{margin-top:2px;}
  .bell-item .bell-time{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .bell-empty{padding:20px;text-align:center;color:var(--text-dim);font-size:12.5px;}
  .bell-footer{display:flex;justify-content:flex-end;padding:6px 4px 2px;}

  /* request cards (employee) */
  .req-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;
    display:flex;flex-direction:column;gap:10px;
  }
  .req-card .req-top{display:flex;align-items:center;justify-content:space-between;}
  .req-card .avail-count{font-size:12px;color:var(--text-dim);}
  .req-card .req-name{font-size:15px;font-weight:700;}

  /* SIM tiles */
  .sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .sim-ring{
    border-radius:17px;padding:3px;transition:background 1s linear;
  }
  .sim-card{
    position:relative;border-radius:14px;padding:16px 16px 14px;
    background:var(--panel-2);border:1px solid var(--border);
    clip-path:polygon(0 0, 84% 0, 100% 16%, 100% 100%, 0 100%);
    transition:border-color .2s;
    height:100%;
  }
  .sim-card.warning{border-color:rgba(240,185,77,0.55);animation:pulseWarn 2.2s infinite;}
  .sim-card.blocked{opacity:0.72;}
  @keyframes pulseWarn{
    0%,100%{box-shadow:0 0 0 0 rgba(240,185,77,0.0);}
    50%{box-shadow:0 0 0 4px rgba(240,185,77,0.08);}
  }
  .sim-chip{
    width:26px;height:18px;border-radius:4px;margin-bottom:10px;
    background:linear-gradient(135deg,#d8c98a,#a9924e);
    position:relative;
  }
  .sim-chip::after{content:"";position:absolute;inset:3px;border-radius:2px;background:repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 1px, transparent 1px 4px);}
  .sim-phone{font-family:var(--mono);font-size:16.5px;font-weight:600;letter-spacing:.01em;margin-bottom:8px;}
  .sim-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .sim-time{font-size:11.5px;color:var(--text-dim);}
  .sim-owner{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .sim-actions{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .sim-actions .btn{padding:7px 4px;font-size:11px;white-space:nowrap;}
  .sim-actions .btn-row{display:flex;gap:6px;}
  .sim-actions .btn-row .btn{flex:1;}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,0.015);}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .fbtn{
    padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
  }
  .fbtn.active{background:var(--accent-dim);color:#cfe0ff;border-color:var(--accent);}

  .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
  .form-row .field{margin-bottom:0;min-width:160px;flex:1;}
  .form-row select{
    width:100%;padding:11px 12px;background:var(--panel-3);border:1px solid var(--border);
    border-radius:9px;color:var(--text);font-size:14px;
  }

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13.5px;}

  /* popup overlay */
  .popup-overlay{
    position:fixed;inset:0;background:rgba(6,9,15,0.86);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .popup-card{
    width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
    border-radius:18px;padding:32px 28px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .popup-icon{
    width:56px;height:56px;border-radius:14px;margin:0 auto 18px;
    background:rgba(240,185,77,0.14);display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  .popup-title{font-size:17px;font-weight:700;margin-bottom:8px;}
  .popup-phone{font-family:var(--mono);font-size:15px;color:var(--text-dim);margin-bottom:4px;}
  .popup-text{font-size:13.5px;color:var(--text-dim);line-height:1.55;margin-bottom:22px;}
  .popup-actions{display:flex;gap:10px;}
  .popup-actions .btn{flex:1;}

  /* toast */
  #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--panel-3);border:1px solid var(--border);border-left:3px solid var(--accent);
    padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.35);
    animation:toastIn .2s ease-out;max-width:320px;
  }
  .toast.success{border-left-color:var(--success);}
  .toast.danger{border-left-color:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,9,15,0.7);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;
  }
  .modal-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;}
  .modal-card h3{margin:0 0 16px;font-size:16px;}

  .settings-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);margin-top:18px;}
  .settings-line input{width:70px;padding:6px 8px;background:var(--panel-3);border:1px solid var(--border);border-radius:6px;color:var(--text);text-align:center;}

  .loader{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"><div class="loader">Загрузка…</div></div>
<div id="toast-wrap"></div>

<script>
/* ================= DATA LAYER ================= */
/* === НАСТРОЙКА SUPABASE — вставьте свои значения из Settings → API === */
const SUPABASE_URL = 'https://xjaztwawglpugciskddn.supabase.co';        // например: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqYXp0d2F3Z2xwdWdjaXNrZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTUyMTMsImV4cCI6MjEwMDk5MTIxM30.JOyH7oM_XWRvMYlUwD9xZvx6WXRlXwpA9zuPNTT4KGQ'; // именно "anon public", НЕ "service_role"!
/* ======================================================================= */

const sb = (SUPABASE_URL.indexOf('ВАШ_')===-1 && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const ADMIN_LOGIN = 'FarmerAdmin';
const ADMIN_PASSWORD = 'Admincash';

/* Жёстко фиксирует, какая это страница: 'admin' или 'operator'.
   Именно поэтому нужны два разных файла — в один хардкодим 'admin', в другой 'operator'. */
const FIXED_PORTAL = 'operator';

let DB = null;
let currentUser = null;   // username string (employee) or null for admin
let currentRole = null;   // 'admin' | 'employee'
let isReadOnlyAdmin = false; // true для роли 'viewer' — админка без прав изменения
let adminTab = 'messengers';
let msgFilterStatus = 'all';
let msgFilterType = 'all';
let msgFilterEmployee = 'all';
let msgFilterDateFrom = '';
let msgFilterDateTo = '';
let msgFiltersPanelOpen = false;
let bulkDeleteMode = false;
let bulkDeleteSelected = new Set();
let lastRenderedMsgIds = [];
let historyFilterType = 'all';
let historyFilterKind = 'all';
let historyFilterEmployee = 'all';
let historyFilterDateFrom = '';
let historyFilterDateTo = '';
let historyFilterPhone = '';
let popupOpen = false;
let adminPollInterval = null;
let presenceChannel = null;
let onlineUsernames = new Set();

function defaultDB(){
  return {
    employees: {}, // username -> {password, name, department, role:'admin'|'operator', norm:null|number}
    messengers: [], // {id,type,phone,status,assignedTo,assignedName,lastHolder,lastHolderName,assignedAt,lastCheck,blockedAt,tempBlockKind,tempBlockUntil,tempBlockStartedAt,createdAt}
    log: [],
    excessRequests: [], // {id, username, name, department, type, requestedAt, status:'pending'|'approved'|'rejected', resolvedBy, resolvedAt, assignedMessengerId, assignedPhone}
    notifications: [], // {id, username, message, ts, read}
    settings: { checkIntervalMinutes: 60 }
  };
}

function normalizeDB(db){
  Object.keys(db.employees).forEach(u=>{
    const e = db.employees[u];
    if(e.department===undefined) e.department = '';
    if(e.role===undefined) e.role = 'operator';
    if(e.normByType===undefined){
      // миграция со старой единой нормы (число или null) на норму по каждому типу
      if(typeof e.norm === 'number'){
        e.normByType = { telegram: e.norm, whatsapp: e.norm, max: e.norm };
      } else {
        e.normByType = { telegram: null, whatsapp: null, max: null };
      }
    }
    if(e.normByType.telegram===undefined) e.normByType.telegram = null;
    if(e.normByType.whatsapp===undefined) e.normByType.whatsapp = null;
    if(e.normByType.max===undefined) e.normByType.max = null;
    if(e.lastLoginAt===undefined) e.lastLoginAt = null;
    delete e.norm;
  });
  db.messengers.forEach(m=>{
    if(m.tempBlockKind===undefined) m.tempBlockKind = null;
    if(m.tempBlockUntil===undefined) m.tempBlockUntil = null;
    if(m.tempBlockStartedAt===undefined) m.tempBlockStartedAt = null;
  });
  if(!db.excessRequests) db.excessRequests = [];
  if(!db.notifications) db.notifications = [];
  if(!db.settings) db.settings = { checkIntervalMinutes: 60 };
  return db;
}

function seedDB(){
  const db = defaultDB();
  db.employees['ivanov'] = { password:'12345', name:'Иванов И.И.', department:'Soft', role:'operator', norm:null };
  const seedNumbers = [
    ['telegram','+7 901 222-11-01'],
    ['telegram','+7 901 222-11-02'],
    ['telegram','+7 901 222-11-03'],
    ['whatsapp','+7 902 333-44-01'],
    ['whatsapp','+7 902 333-44-02'],
    ['max','+7 903 555-66-01'],
    ['max','+7 903 555-66-02'],
  ];
  seedNumbers.forEach(([type,phone])=>{
    db.messengers.push({
      id: uid(), type, phone, status:'available',
      assignedTo:null, assignedName:null, lastHolder:null, lastHolderName:null,
      assignedAt:null, lastCheck:null, blockedAt:null,
      tempBlockKind:null, tempBlockUntil:null, tempBlockStartedAt:null, createdAt: Date.now()
    });
  });
  return db;
}

function uid(){ return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('Тайм-аут подключения к Supabase')), ms))
  ]);
}

async function loadDB(){
  if(!sb){
    showToast('Supabase не настроен — заполните SUPABASE_URL и SUPABASE_ANON_KEY в коде', 'danger');
    return seedDB();
  }
  let res;
  try{
    res = await withTimeout(sb.from('sim_desk_state').select('data').eq('id', 1).single(), 10000);
  }catch(e){
    throw new Error('Не удалось подключиться к Supabase. Проверьте интернет-соединение (или VPN) и что проект в Supabase не приостановлен.');
  }
  const { data, error } = res;
  if(error){
    if(error.code === 'PGRST116'){
      // строки в таблице действительно ещё нет — это первый запуск, создаём её
      const seeded = seedDB();
      try{ await withTimeout(sb.from('sim_desk_state').upsert({ id:1, data: seeded }), 10000); }catch(e){}
      return seeded;
    }
    throw new Error('Ошибка Supabase: ' + (error.message || 'неизвестная ошибка') + '. Данные НЕ были перезаписаны.');
  }
  if(data && data.data && Object.keys(data.data).length) return normalizeDB(data.data);
  const seeded = seedDB();
  try{ await withTimeout(sb.from('sim_desk_state').update({ data: seeded }).eq('id', 1), 10000); }catch(e){}
  return seeded;
}

async function saveDB(){
  if(!sb){ showToast('Supabase не настроен', 'danger'); return; }
  try{
    const { error } = await withTimeout(sb.from('sim_desk_state').update({ data: DB, updated_at: new Date().toISOString() }).eq('id', 1), 10000);
    if(error) throw error;
  }catch(e){
    showToast('Не удалось сохранить данные (проверьте соединение)', 'danger');
  }
}

async function refreshFromStorage(){
  if(!sb) return;
  try{
    const { data, error } = await withTimeout(sb.from('sim_desk_state').select('data').eq('id', 1).single(), 10000);
    if(error) throw error;
    if(data && data.data) DB = normalizeDB(data.data);
  }catch(e){ /* ignore transient errors, keep current in-memory DB */ }
}

function setupRealtimeSync(){
  if(!sb) return;
  try{
    sb.channel('sim_desk_changes')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'sim_desk_state', filter:'id=eq.1' }, payload=>{
        if(!payload.new || !payload.new.data) return;
        DB = normalizeDB(payload.new.data);
        if(currentRole==='employee'){
          if(!popupOpen){ renderEmployee(); } else { maybeShowPopupForEmployee(); }
          checkForNewNotifications(currentUser);
        } else if(currentRole==='admin'){
          if(!isAdminFormActive()){
            renderAdminTabContent();
          }
          updatePendingBadge();
        }
      })
      .subscribe();
  }catch(e){ /* realtime is a nice-to-have, ignore failures */ }
}

async function joinPresenceChannel(){
  if(!sb) return;
  try{
    const key = currentUser ? currentUser : ('superadmin_' + uid());
    const displayName = currentUser ? (DB.employees[currentUser] ? DB.employees[currentUser].name : currentUser) : 'FarmerAdmin';
    presenceChannel = sb.channel('online-operators', { config: { presence: { key } } });
    presenceChannel.on('presence', { event: 'sync' }, ()=>{
      const state = presenceChannel.presenceState();
      const set = new Set();
      Object.values(state).forEach(entries=>{ entries.forEach(p=>{ if(p.username) set.add(p.username); }); });
      onlineUsernames = set;
      if(currentRole==='admin' && !isAdminFormActive()){
        renderAdminTabContent();
      }
    });
    presenceChannel.subscribe(async (status)=>{
      if(status === 'SUBSCRIBED'){
        await presenceChannel.track({ username: currentUser || 'FarmerAdmin', name: displayName, role: currentRole, since: Date.now() });
      }
    });
  }catch(e){ /* presence is a nice-to-have, ignore failures */ }
}

async function leavePresenceChannel(){
  if(!presenceChannel) return;
  try{
    await presenceChannel.untrack();
    sb.removeChannel(presenceChannel);
  }catch(e){ /* ignore */ }
  presenceChannel = null;
  onlineUsernames = new Set();
}

function processTempBlockExpirations(){
  const now = Date.now();
  let changed = false;
  DB.messengers.forEach(m=>{
    if(m.status==='temp_blocked' && m.tempBlockUntil && now >= m.tempBlockUntil){
      if(m.tempBlockKind==='whatsapp6h'){
        const holder = m.assignedTo;
        m.status = 'assigned';
        m.lastCheck = now;
        log('temp_block_expired', { username: holder, messengerId:m.id, phone:m.phone, type:m.type, kind:'whatsapp6h' });
        addNotification(holder, 'Временная блокировка снята: номер '+m.phone+' (WhatsApp) снова активен');
      } else if(m.tempBlockKind==='max10d'){
        log('temp_block_expired', { username: actingAdminUsername(), messengerId:m.id, phone:m.phone, type:m.type, kind:'max10d' });
        m.status = 'available';
        m.assignedTo = null; m.assignedName = null; m.assignedAt = null; m.lastCheck = null;
      }
      m.tempBlockKind = null; m.tempBlockUntil = null; m.tempBlockStartedAt = null;
      changed = true;
    }
  });
  return changed;
}

let audioCtx = null;
function playNotificationSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ring = (freq, delay)=>{
      setTimeout(()=>{
        try{
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.28, audioCtx.currentTime+0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.32);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(); o.stop(audioCtx.currentTime+0.35);
        }catch(e){}
      }, delay);
    };
    ring(880, 0);
    ring(1180, 150);
  }catch(e){ /* audio blocked or unsupported, ignore silently */ }
}

let knownNotificationIds = new Set();
function primeKnownNotifications(username){
  knownNotificationIds = new Set(DB.notifications.filter(n=>n.username===username).map(n=>n.id));
}
function checkForNewNotifications(username){
  const mine = DB.notifications.filter(n=>n.username===username);
  const fresh = mine.filter(n=>!knownNotificationIds.has(n.id));
  if(fresh.length){
    playNotificationSound();
    fresh.forEach(n=>{ knownNotificationIds.add(n.id); showToast(n.message, 'success'); });
  }
}

/* ================= HELPERS ================= */
function typeLabel(t){ return t==='telegram'?'Telegram': t==='whatsapp'?'WhatsApp':'MAX'; }
function statusLabel(s){ return s==='available'?'Свободен': s==='assigned'?'Выдан': s==='temp_blocked'?'Врем. блок':'Заблокирован'; }

function fmtDuration(ms){
  if(ms<0) ms=0;
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  if(h<=0) return m+' мин';
  return h+' ч '+m+' мин';
}
function fmtDateTime(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

function getWeekStartTs(d){
  const date = d ? new Date(d) : new Date();
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = (day===0 ? -6 : 1-day); // shift to Monday
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date.getTime();
}

function weeklyUsedCount(username, type){
  const weekStart = getWeekStartTs();
  return DB.log.filter(e=>e.event==='assigned' && e.username===username && e.ts>=weekStart && (!type || e.type===type)).length;
}

function getQuotaStatus(username, type){
  const emp = DB.employees[username];
  const norm = emp && emp.normByType ? emp.normByType[type] : null;
  const used = weeklyUsedCount(username, type);
  const hasQuota = (norm===null || norm===undefined) || used < norm;
  return { norm, used, hasQuota };
}

const STALE_CHECK_DAYS = 5;
function getEmployeeStaleWarning(username){
  const emp = DB.employees[username];
  if(!emp) return null;
  const mine = DB.messengers.filter(m=>m.assignedTo===username && m.status==='assigned');
  if(!mine.length) return null;
  if(!emp.lastLoginAt){
    return { days: null, neverLoggedIn: true, count: mine.length };
  }
  const daysSince = (Date.now() - emp.lastLoginAt) / (24*3600000);
  if(daysSince >= STALE_CHECK_DAYS){
    return { days: Math.floor(daysSince), neverLoggedIn: false, count: mine.length };
  }
  return null;
}

function renderLogin(errorMsg){

    : 'Запрос мессенджеров и учёт активных номеров.';
  const hint = portal==='admin'
    ? 'Эта страница предназначена только для администраторов. Сотрудникам её адрес не передавайте.'
    : 'Доступ сотруднику выдаёт администратор во вкладке «Доступы». Без учётной записи войти нельзя.';
  app.innerHTML = `

        <div class="login-mark"></div>
        <h1 class="login-title">${title}</h1>
        <p class="login-sub">${sub}</p>
        <div class="field">
          <label>Логин</label>
          <input id="login-username" type="text" autocomplete="username" placeholder="Ваш логин">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Ваш пароль">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Войти</button>
        ${errorMsg ? `<div class="login-error">${escapeHtml(errorMsg)}</div>` : ''}
        <div class="login-hint">${hint}</div>
      </div>
    </div>
  `;
  document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); });
}

function getPortalMode(){
  return FIXED_PORTAL;
}

async function handleLogin(){
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const portal = getPortalMode();
  if(u === ADMIN_LOGIN && p === ADMIN_PASSWORD){
    if(portal!=='admin'){ renderLogin('Неверный логин или пароль.'); return; }
    currentRole = 'admin'; currentUser = null; isReadOnlyAdmin = false;
    renderAdmin();
    joinPresenceChannel();
    return;
  }
  const emp = DB.employees[u];
  if(emp && emp.password === p){
    if(emp.role === 'admin'){
      if(portal!=='admin'){ renderLogin('Неверный логин или пароль.'); return; }
      emp.lastLoginAt = Date.now();
      await saveDB();
      currentRole = 'admin'; currentUser = u; isReadOnlyAdmin = false;
      renderAdmin();
      joinPresenceChannel();
      return;
    }
    if(portal!=='operator'){ renderLogin('Неверный логин или пароль.'); return; }
    emp.lastLoginAt = Date.now();
    await saveDB();
    currentRole = 'employee'; currentUser = u; isReadOnlyAdmin = false;
    renderEmployee();
    startEmployeeClock();
    joinPresenceChannel();
    return;
  }
  renderLogin('Неверный логин или пароль.');
}

function logout(){
  leavePresenceChannel();
  currentRole = null; currentUser = null; popupOpen = false; isReadOnlyAdmin = false;
  if(employeeClockInterval) clearInterval(employeeClockInterval);
  if(adminPollInterval) clearInterval(adminPollInterval);
  renderLogin();
}

function simCardHtml(m){
  const isTemp = m.status==='temp_blocked';
  const isBlocked = m.status==='blocked';
  let timeInfo = '';
  let warnClass = '';
  let ringStyle = '';
  if(isTemp){
    const total = m.tempBlockUntil - m.tempBlockStartedAt;
    const remaining = Math.max(0, m.tempBlockUntil - Date.now());
    const frac = total>0 ? Math.max(0, Math.min(1, remaining/total)) : 0;
    const pct = (frac*100).toFixed(1);
    const kindLabel = m.tempBlockKind==='whatsapp6h' ? 'Временный блок 6ч' : 'Временный блок 10 дней';
    timeInfo = `<div class="sim-time">${kindLabel} · осталось ${fmtDuration(remaining)}</div>`;
    ringStyle = `background: conic-gradient(var(--warning) ${pct}%, rgba(255,255,255,0.07) ${pct}%);`;
  } else if(!isBlocked){
    const interval = (DB.settings.checkIntervalMinutes||60)*60000;
    const elapsedSinceCheck = Date.now() - m.lastCheck;
    const remaining = Math.max(0, interval - elapsedSinceCheck);
    const remainingFrac = Math.max(0, Math.min(1, remaining/interval));
    const pct = (remainingFrac*100).toFixed(1);
    timeInfo = `<div class="sim-time">Проверка через ${fmtDuration(remaining)}</div>`;
    const isWarn = remaining < 5*60000;
    if(isWarn) warnClass = ' warning';
    const ringColor = isWarn ? 'var(--warning)' : 'var(--accent)';
    ringStyle = `background: conic-gradient(${ringColor} ${pct}%, rgba(255,255,255,0.07) ${pct}%);`;
  } else {
    timeInfo = `<div class="sim-time">Заблокирован ${fmtDateTime(m.blockedAt)}</div>`;
    ringStyle = `background: rgba(255,255,255,0.05);`;
  }

  let actions = '';
  if(!isTemp && !isBlocked){
    if(m.type==='whatsapp'){
      actions = `
        <div class="sim-actions">
          <button class="btn btn-ghost btn-sm" onclick="cardConfirmActive('${m.id}')">До сих пор активный</button>
          <div class="btn-row">
            <button class="btn btn-sm" style="background:rgba(240,185,77,0.14);color:var(--warning);border:1px solid rgba(240,185,77,0.3);" onclick="cardTempBlock('${m.id}')">Врем. блок 6ч</button>
            <button class="btn btn-danger btn-sm" onclick="cardBlock('${m.id}')">Блок навсегда</button>
          </div>
        </div>
      `;
    } else if(m.type==='max'){
      actions = `
        <div class="sim-actions">
          <button class="btn btn-ghost btn-sm" onclick="cardConfirmActive('${m.id}')">До сих пор активный</button>
          <div class="btn-row">

let employeeClockInterval = null;
function startEmployeeClock(){
  if(employeeClockInterval) clearInterval(employeeClockInterval);
  primeKnownNotifications(currentUser);
  employeeClockInterval = setInterval(async ()=>{
    if(currentRole==='employee'){
      await refreshFromStorage();
      const changed = processTempBlockExpirations();
      if(changed) await saveDB();
      if(!popupOpen){
        renderEmployee();
      } else {
        maybeShowPopupForEmployee();
        checkForNewNotifications(currentUser);
      }
    } else {
      clearInterval(employeeClockInterval);
    }
  }, 5000);
}

async function manualRefreshEmployee(){
  await refreshFromStorage();
  const changed = processTempBlockExpirations();
  if(changed) await saveDB();
  if(!popupOpen) renderEmployee();
  showToast('Данные обновлены', 'success');
}

function maybeShowPopupForEmployee(){
  if(popupOpen || currentRole!=='employee') return;
  const interval = (DB.settings.checkIntervalMinutes||60)*60000;
  const mine = DB.messengers.filter(m=>m.assignedTo===currentUser && m.status==='assigned');
  const due = mine.find(m=> (Date.now() - m.lastCheck) >= interval);
  if(due) openCheckPopup(due);
}

function openCheckPopup(m){
  popupOpen = true;
  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  overlay.id = 'check-popup-overlay';
  const extraBtn = m.type==='whatsapp'
    ? `<button class="btn btn-sm" style="background:rgba(240,185,77,0.14);color:var(--warning);border:1px solid rgba(240,185,77,0.3);flex:1;" onclick="popupTempBlock('${m.id}')">Врем. блок 6ч</button>`
    : m.type==='max'
    ? `<button class="btn btn-sm" style="background:rgba(240,185,77,0.14);color:var(--warning);border:1px solid rgba(240,185,77,0.3);flex:1;" onclick="popupTempBlock('${m.id}')">Врем. блок 10дн</button>`
    : '';
  overlay.innerHTML = `
    <div class="popup-card">
      <div class="popup-icon">⏱</div>
      <div class="popup-title">Проверка мессенджера</div>
      <div class="popup-phone">${escapeHtml(m.phone)} · ${typeLabel(m.type)}</div>
      <div class="popup-text">Прошёл час с последней проверки. Аккаунт заблокирован / забанен на стороне мессенджера?</div>
      <div class="popup-actions">
        <button class="btn btn-ghost" onclick="answerCheckPopup('${m.id}', false)">До сих пор активный</button>

      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeCheckPopupIfOpen(){
  const overlay = document.getElementById('check-popup-overlay');
  if(overlay){ overlay.remove(); popupOpen = false; }
}

async function markMessengerActive(id){
  const m = DB.messengers.find(x=>x.id===id);
  if(!m) return;
  m.lastCheck = Date.now();
  log('confirmed_active', { username: currentUser, messengerId: m.id, phone: m.phone, type: m.type });
  await saveDB();
}

async function markMessengerBlocked(id){
  const m = DB.messengers.find(x=>x.id===id);
  if(!m) return;
  m.status = 'blocked';
  m.assignedTo = null;
  m.blockedAt = Date.now();
  log('blocked', { username: currentUser, messengerId: m.id, phone: m.phone, type: m.type });
  await saveDB();
  showToast('Номер '+m.phone+' перемещён в заблокированные', 'danger');
}

async function markMessengerTempBlocked(id){
  const m = DB.messengers.find(x=>x.id===id);
  if(!m || (m.type!=='whatsapp' && m.type!=='max')) return;
  const now = Date.now();
  if(m.type==='whatsapp'){
    m.status = 'temp_blocked';
    m.tempBlockKind = 'whatsapp6h';
    m.tempBlockStartedAt = now;
    m.tempBlockUntil = now + 6*3600000;
    log('temp_blocked', { username: currentUser, messengerId: m.id, phone: m.phone, type: m.type, kind:'whatsapp6h' });
    showToast('Временная блокировка на 6 часов установлена', 'danger');
  } else {
    m.status = 'temp_blocked';
    m.tempBlockKind = 'max10d';
    m.tempBlockStartedAt = now;
    m.tempBlockUntil = now + 10*24*3600000;
    m.assignedTo = null;
    log('temp_blocked', { username: currentUser, messengerId: m.id, phone: m.phone, type: m.type, kind:'max10d' });
    showToast('Временная блокировка на 10 дней установлена', 'danger');
  }
  await saveDB();
}

async function answerCheckPopup(messengerId, isBlocked){
  closeCheckPopupIfOpen();
  if(isBlocked){ await markMessengerBlocked(messengerId); } else { await markMessengerActive(messengerId); }
  renderEmployee();
  setTimeout(maybeShowPopupForEmployee, 700);
}

async function popupTempBlock(id){
  closeCheckPopupIfOpen();
  await markMessengerTempBlocked(id);
  renderEmployee();
  setTimeout(maybeShowPopupForEmployee, 700);
}

async function cardConfirmActive(id){
  closeCheckPopupIfOpen();
  await markMessengerActive(id);
  renderEmployee();
  setTimeout(maybeShowPopupForEmployee, 300);
}

async function cardBlock(id){
  closeCheckPopupIfOpen();
  await markMessengerBlocked(id);
  renderEmployee();
  setTimeout(maybeShowPopupForEmployee, 300);
}

async function cardTempBlock(id){
  closeCheckPopupIfOpen();
  await markMessengerTempBlocked(id);
  renderEmployee();
  setTimeout(maybeShowPopupForEmployee, 300);
}

function exportMessengersToExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Библиотека для Excel не загрузилась. Проверьте интернет-соединение.', 'danger'); return; }
  let list = DB.messengers.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(msgFilterStatus!=='all') list = list.filter(m=>m.status===msgFilterStatus);
  if(msgFilterType!=='all') list = list.filter(m=>m.type===msgFilterType);
  if(msgFilterEmployee!=='all') list = list.filter(m=>m.assignedTo===msgFilterEmployee || m.lastHolder===msgFilterEmployee);
  if(msgFilterDateFrom){
    const fromTs = new Date(msgFilterDateFrom+'T00:00:00').getTime();
    list = list.filter(m=>m.createdAt && m.createdAt>=fromTs);
  }
  if(msgFilterDateTo){
    const toTs = new Date(msgFilterDateTo+'T23:59:59').getTime();
    list = list.filter(m=>m.createdAt && m.createdAt<=toTs);
  }
  if(!list.length){ showToast('Нет данных под текущий фильтр для экспорта', 'danger'); return; }
  const rows = list.map(m=>({
    'Номер': m.phone,
    'Тип': typeLabel(m.type),
    'Статус': statusLabel(m.status),
    'Сотрудник': m.assignedName || m.lastHolderName || '',
    'Добавлен': fmtDateTime(m.createdAt),
    'Выдан': fmtDateTime(m.assignedAt),
    'Заблокирован': fmtDateTime(m.blockedAt)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);

function getIssuanceEntries(){
  const empName = (u)=> DB.employees[u] ? DB.employees[u].name : (u || '—');
  const entries = [];
  DB.log.forEach(e=>{
    if(e.event==='assigned'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.username,
        recipientName: empName(e.username),
        issuedByLabel: actorDisplayName(e.issuedBy) + (e.source==='excess' ? ' (сверх нормы)' : ''),
        kind: 'Выдача'
      });
    } else if(e.event==='admin_reassigned'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.to,
        recipientName: empName(e.to),
        issuedByLabel: actorDisplayName(e.username),
        kind: 'Переназначение'
      });
    } else if(e.event==='created_messenger'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: null,
        recipientName: '—',
        issuedByLabel: actorDisplayName(e.username) + (e.source==='bulk_import' ? ' (Excel)' : ''),
        kind: 'Добавлен в пул'
      });
    } else if(e.event==='deleted_messenger'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: null,
        recipientName: '—',
        issuedByLabel: actorDisplayName(e.username) + (e.source==='bulk_delete' ? ' (массово)' : ''),
        kind: 'Удалён из пула'
      });
    } else if(e.event==='admin_revoked'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.previousHolder || null,
        recipientName: e.previousHolder ? empName(e.previousHolder) : (e.previousHolderName || '—'),
        issuedByLabel: 'Забрал: ' + actorDisplayName(e.username),
        kind: 'Забран у сотрудника'
      });
    } else if(e.event==='admin_unassigned'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.previousHolder || null,
        recipientName: e.previousHolder ? empName(e.previousHolder) : (e.previousHolderName || '—'),
        issuedByLabel: 'Забрал: ' + actorDisplayName(e.username),
        kind: 'Забран у сотрудника'
      });
    } else if(e.event==='blocked'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.username,
        recipientName: empName(e.username),
        issuedByLabel: 'Заблокировал сам сотрудник',
        kind: 'Забран у сотрудника'
      });
    } else if(e.event==='temp_blocked' && e.kind==='max10d'){
      entries.push({
        ts: e.ts,
        phone: e.phone,
        type: e.type,
        recipientUsername: e.username,
        recipientName: empName(e.username),
        issuedByLabel: 'Временный блок MAX — снят с сотрудника',
        kind: 'Забран у сотрудника'
      });
    }
  });
  return entries.sort((a,b)=>b.ts-a.ts);
}

function exportIssuanceHistoryToExcel(){

  let entries = getIssuanceEntries();
  if(historyFilterType!=='all') entries = entries.filter(e=>e.type===historyFilterType);
  if(historyFilterKind!=='all') entries = entries.filter(e=>e.kind===historyFilterKind);
  if(historyFilterEmployee!=='all') entries = entries.filter(e=>e.recipientUsername===historyFilterEmployee);
  if(historyFilterPhone.trim()){
    const needle = historyFilterPhone.replace(/\s+/g,'').toLowerCase();
    entries = entries.filter(e=>e.phone && e.phone.replace(/\s+/g,'').toLowerCase().indexOf(needle)>-1);
  }
  if(historyFilterDateFrom){
    const fromTs = new Date(historyFilterDateFrom+'T00:00:00').getTime();
    entries = entries.filter(e=>e.ts>=fromTs);
  }
  if(historyFilterDateTo){
    const toTs = new Date(historyFilterDateTo+'T23:59:59').getTime();
    entries = entries.filter(e=>e.ts<=toTs);
  }
  if(!entries.length){ showToast('Нет данных под текущий фильтр для экспорта', 'danger'); return; }
  const rows = entries.map(e=>({
    'Когда': fmtDateTime(e.ts),

    'Тип': typeLabel(e.type),
    'Событие': e.kind,
    'Сотрудник': e.recipientName,
    'Кто выполнил': e.issuedByLabel
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:20},{wch:12},{wch:16},{wch:20},{wch:24}];

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'sim_desk_история_номеров_'+dateStr+'.xlsx');
  showToast('Экспортировано записей: '+entries.length, 'success');
}

function normalizeMessengerType(raw){
  const s = String(raw||'').toLowerCase().trim();
  if(s.indexOf('telegram')>-1 || s.indexOf('телеграм')>-1 || s==='tg') return 'telegram';
  if(s.indexOf('whatsapp')>-1 || s.indexOf('ватсап')>-1 || s.indexOf('вотсап')>-1 || s==='wa') return 'whatsapp';
  if(s.indexOf('max')>-1 || s.indexOf('макс')>-1) return 'max';
  return null;
}

async function handleExcelUpload(){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  const input = document.getElementById('excel-upload-input');
  const statusEl = document.getElementById('excel-upload-status');
  const file = input && input.files[0];
  if(!file){ showToast('Выберите файл', 'danger'); return; }
  if(typeof XLSX === 'undefined'){ showToast('Библиотека для чтения Excel не загрузилась. Проверьте интернет-соединение.', 'danger'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1 });
    let added = 0, skipped = 0;
    rows.forEach(row=>{
      if(!row || !row.length) return;
      const phoneRaw = row[0];
      const typeRaw = row[1];
      if(phoneRaw===undefined || phoneRaw===null || String(phoneRaw).trim()==='') return;
      const phone = String(phoneRaw).trim();
      const type = normalizeMessengerType(typeRaw);
      if(!type){ skipped++; return; }
      const m = {
        id: uid(), type, phone, status:'available',
        assignedTo:null, assignedName:null, lastHolder:null, lastHolderName:null,
        assignedAt:null, lastCheck:null, blockedAt:null,
        tempBlockKind:null, tempBlockUntil:null, tempBlockStartedAt:null, createdAt: Date.now()
      };
      DB.messengers.push(m);
      log('created_messenger', { username: actingAdminUsername(), messengerId:m.id, phone:m.phone, type:m.type, source:'bulk_import' });
      added++;
    });
    await saveDB();
    if(statusEl) statusEl.textContent = 'Добавлено: '+added+(skipped?', пропущено (не распознан тип): '+skipped:'');
    showToast('Загрузка завершена: добавлено '+added+' номеров', 'success');
    if(input) input.value = '';
    renderAdminTabContent();
  }catch(e){
    showToast('Не удалось прочитать файл. Проверьте формат .xlsx', 'danger');
  }
}

      m.assignedAt = now; m.lastCheck = now;
      m.blockedAt = null; m.tempBlockKind = null; m.tempBlockUntil = null; m.tempBlockStartedAt = null;
      log('admin_reassigned', { username: actingAdminUsername(), messengerId:m.id, phone:m.phone, type:m.type, to:newEmpUser });

      m.status = 'available';
      m.assignedTo = null; m.assignedName = null;
      m.assignedAt = null; m.lastCheck = null;
      m.blockedAt = null; m.tempBlockKind = null; m.tempBlockUntil = null; m.tempBlockStartedAt = null;

  showToast('Номер обновлён', 'success');

const LOG_EVENT_LABELS = {
  created_messenger: 'Номер добавлен в базу',
  bulk_import: 'Номер добавлен в базу (загрузка из Excel)',
  assigned: 'Выдан сотруднику',
  confirmed_active: 'Сотрудник подтвердил: номер активен',
  blocked: 'Помечен как заблокирован (навсегда)',
  temp_blocked: 'Установлена временная блокировка',
  temp_block_expired: 'Временная блокировка снята автоматически',
  temp_block_cleared_by_admin: 'Временная блокировка снята администратором',
  admin_revoked: 'Отозван администратором, возвращён в пул',
  admin_returned: 'Возвращён в пул администратором',
  edited_messenger: 'Изменены данные номера (тип/номер)',
  admin_reassigned: 'Переназначен администратором',
  admin_unassigned: 'Снят с сотрудника администратором'
};

function roleLabel(role){
  return role==='admin' ? 'Админ' : role==='viewer' ? 'Наблюдатель' : 'Оператор';
}

function actorDisplayName(username){
  if(!username || username==='automation') return 'Автоматизация';
  if(username==='admin') return 'Администратор (FarmerAdmin)';
  const emp = DB.employees[username];
  return emp ? emp.name : username;
}

const ADMIN_ACTOR_EVENTS = ['admin_revoked','admin_returned','created_messenger','bulk_import','edited_messenger','temp_block_cleared_by_admin','admin_unassigned'];

function describeLogEntry(e){
  const empName = (u)=> DB.employees[u] ? DB.employees[u].name : u;
  let label = LOG_EVENT_LABELS[e.event] || e.event;
  if(e.event==='assigned' && e.username){
    label += ': ' + empName(e.username);
    label += ' — выдал: ' + actorDisplayName(e.issuedBy);
  }
  if(e.event==='confirmed_active' && e.username) label += ' (' + empName(e.username) + ')';
  if(e.event==='blocked' && e.username) label += ' — отметил(а) ' + empName(e.username);
  if(e.event==='temp_blocked'){
    label += e.kind==='whatsapp6h' ? ' (WhatsApp, 6ч)' : e.kind==='max10d' ? ' (MAX, 10 дней)' : '';
    if(e.username) label += ' — ' + empName(e.username);
  }
  if(e.event==='temp_block_expired'){
    label += e.kind==='whatsapp6h' ? ' (WhatsApp, вернулся к сотруднику)' : e.kind==='max10d' ? ' (MAX, вернулся в общий пул)' : '';
  }
  if(e.event==='admin_reassigned' && e.to){
    label += ': ' + empName(e.to);
    label += ' — выполнил(а): ' + actorDisplayName(e.username);
  }
  if(ADMIN_ACTOR_EVENTS.indexOf(e.event)>-1 && e.username){
    label += ' — выполнил(а): ' + actorDisplayName(e.username);
  }
  return label;
}

async function adminCreateEmployee(){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  const name = document.getElementById('new-emp-name').value.trim();
  const dept = document.getElementById('new-emp-dept').value.trim();
  const loginVal = document.getElementById('new-emp-login').value.trim();
  const pass = document.getElementById('new-emp-password').value;
  const role = document.getElementById('new-emp-role').value;
  if(!name || !loginVal || !pass){ showToast('Заполните ФИО, логин и пароль', 'danger'); return; }
  if(loginVal === ADMIN_LOGIN){ showToast('Этот логин зарезервирован', 'danger'); return; }
  if(DB.employees[loginVal]){ showToast('Такой логин уже существует', 'danger'); return; }
  DB.employees[loginVal] = { password: pass, name, department: dept, role, normByType: { telegram:null, whatsapp:null, max:null }, lastLoginAt: null };
  log('created_employee', { username: loginVal });
  await saveDB();
  showToast('Доступ создан', 'success');
  renderAdminTabContent();
}

async function adminDeleteEmployee(u){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  if(!DB.employees[u]) return;
  delete DB.employees[u];
  // free up any messengers assigned to this employee
  DB.messengers.forEach(m=>{
    if(m.assignedTo===u){ m.status='available'; m.assignedTo=null; m.assignedName=null; m.assignedAt=null; m.lastCheck=null; }
  });
  log('deleted_employee', { username: u });
  await saveDB();
  showToast('Доступ удалён', 'success');
  renderAdminTabContent();
}

        <thead><tr><th>Сотрудник</th><th>Отдел</th><th>Telegram</th><th>WhatsApp</th><th>MAX</th><th>Изменить</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : '<div class="empty-state">Сотрудники ещё не добавлены</div>'}
    </div>
  `;
}

function parseNormInput(val){
  const trimmed = String(val||'').trim();
  return trimmed==='' ? null : Math.max(0, parseInt(trimmed,10));
}

async function setNormForEmployee(u){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  if(!DB.employees[u]) return;
  const tg = document.getElementById('norm-tg-'+u).value;
  const wa = document.getElementById('norm-wa-'+u).value;
  const max = document.getElementById('norm-max-'+u).value;
  DB.employees[u].normByType = {
    telegram: parseNormInput(tg),
    whatsapp: parseNormInput(wa),
    max: parseNormInput(max)
  };
  await saveDB();
  showToast('Нормы обновлены для '+DB.employees[u].name, 'success');
  renderAdminTabContent();
}

async function clearNormForEmployee(u){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  if(!DB.employees[u]) return;
  DB.employees[u].normByType = { telegram:null, whatsapp:null, max:null };
  await saveDB();
  showToast('Все ограничения сняты', 'success');
  renderAdminTabContent();
}

async function setNormForDepartment(){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  const dept = document.getElementById('dept-norm-select').value;
  if(!dept){ showToast('Выберите отдел', 'danger'); return; }
  const tgRaw = document.getElementById('dept-norm-tg').value.trim();
  const waRaw = document.getElementById('dept-norm-wa').value.trim();
  const maxRaw = document.getElementById('dept-norm-max').value.trim();
  if(tgRaw==='' && waRaw==='' && maxRaw===''){ showToast('Заполните хотя бы одно поле нормы', 'danger'); return; }
  let count = 0;
  Object.keys(DB.employees).forEach(u=>{
    const emp = DB.employees[u];
    if(emp.department !== dept) return;
    if(!emp.normByType) emp.normByType = { telegram:null, whatsapp:null, max:null };
    if(tgRaw!=='') emp.normByType.telegram = parseNormInput(tgRaw);
    if(waRaw!=='') emp.normByType.whatsapp = parseNormInput(waRaw);
    if(maxRaw!=='') emp.normByType.max = parseNormInput(maxRaw);
    count++;
  });
  await saveDB();
  showToast('Нормы применены к '+count+' сотрудникам отдела '+dept, 'success');
  renderAdminTabContent();
}

/* ---- Excess requests tab ---- */
function adminExcessHtml(){
  const pending = DB.excessRequests.filter(r=>r.status==='pending').sort((a,b)=>a.requestedAt-b.requestedAt);
  const history = DB.excessRequests.filter(r=>r.status!=='pending').sort((a,b)=>b.resolvedAt-a.resolvedAt);

  const pendingRows = pending.map(r=>{
    const availableForType = DB.messengers.filter(m=>m.status==='available' && m.type===r.type);
    const selectOptions = availableForType.map(m=>`<option value="${m.id}">${escapeHtml(m.phone)}</option>`).join('');
    return `
      <tr>
        <td>${escapeHtml(r.name)}</td>
        <td style="color:var(--text-dim)">${r.department ? escapeHtml(r.department) : '—'}</td>
        <td><span class="tbadge ${r.type}"><span class="dot"></span>${typeLabel(r.type)}</span></td>
        <td>${fmtDateTime(r.requestedAt)}</td>
        <td>
          ${isReadOnlyAdmin ? '<span style="font-size:12px;color:var(--text-faint);">только просмотр</span>' : `
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="approveExcessRequest('${r.id}','random')">Выдать случайный</button>
            ${availableForType.length ? `
              <select id="excess-select-${r.id}" style="padding:6px 8px;background:var(--panel-3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12.5px;">
                ${selectOptions}
              </select>
              <button class="btn btn-ghost btn-sm" onclick="approveExcessRequest('${r.id}','specific')">Выдать выбранный</button>
            ` : '<span style="font-size:12px;color:var(--text-faint);">нет свободных номеров этого типа</span>'}
            <button class="btn btn-danger btn-sm" onclick="rejectExcessRequest('${r.id}')">Отклонить</button>
          </div>
          `}
        </td>
      </tr>
    `;
  }).join('');

  const historyRows = history.map(r=>`
    <tr>
      <td>${escapeHtml(r.name)}</td>
      <td><span class="tbadge ${r.type}"><span class="dot"></span>${typeLabel(r.type)}</span></td>
      <td><span class="sbadge ${r.status==='approved'?'assigned':'blocked'}">${r.status==='approved'?'Выдано':'Отклонено'}</span></td>
      <td>${r.assignedPhone ? escapeHtml(r.assignedPhone) : '—'}</td>
      <td>${fmtDateTime(r.resolvedAt)}</td>
    </tr>
  `).join('');

  return `
    <div class="section-title">Запросы сверх нормы</div>
    <p class="section-sub">Сотрудник исчерпал недельную норму и запросил номер дополнительно. Решение принимает администратор.</p>
    <div class="card" style="padding:8px 16px;margin-bottom:28px;">
      ${pending.length ? `
      <table>
        <thead><tr><th>Сотрудник</th><th>Отдел</th><th>Тип</th><th>Время запроса</th><th></th></tr></thead>
        <tbody>${pendingRows}</tbody>
      </table>` : '<div class="empty-state">Нет ожидающих запросов</div>'}
    </div>

    <div class="section-title">История решений</div>
    <div class="card" style="padding:8px 16px;">
      ${history.length ? `
      <table>
        <thead><tr><th>Сотрудник</th><th>Тип</th><th>Решение</th><th>Номер</th><th>Когда</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>` : '<div class="empty-state">Пока пусто</div>'}
    </div>
  `;
}

async function approveExcessRequest(reqId, mode){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  const r = DB.excessRequests.find(x=>x.id===reqId);
  if(!r || r.status!=='pending') return;
  let m = null;
  if(mode==='random'){
    m = DB.messengers.find(x=>x.status==='available' && x.type===r.type);
    if(!m){ showToast('Нет свободных номеров этого типа', 'danger'); return; }
  } else {
    const select = document.getElementById('excess-select-'+reqId);
    const id = select ? select.value : null;
    m = DB.messengers.find(x=>x.id===id && x.status==='available');
    if(!m){ showToast('Выберите свободный номер', 'danger'); return; }
  }
  const emp = DB.employees[r.username];
  const now = Date.now();
  m.status = 'assigned';
  m.assignedTo = r.username;
  m.assignedName = emp ? emp.name : r.username;
  m.lastHolder = r.username;
  m.lastHolderName = emp ? emp.name : r.username;
  m.assignedAt = now;
  m.lastCheck = now;
  m.blockedAt = null;
  log('assigned', { username: r.username, messengerId: m.id, phone: m.phone, type: m.type, source:'excess', issuedBy: actingAdminUsername() });
  r.status = 'approved';
  r.resolvedBy = actingAdminUsername();
  r.resolvedAt = now;
  r.assignedMessengerId = m.id;
  r.assignedPhone = m.phone;
  addNotification(r.username, 'Вам согласована выдача сверх нормы: номер '+m.phone+' ('+typeLabel(m.type)+')');
  await saveDB();
  showToast('Номер '+m.phone+' выдан сотруднику '+ (emp?emp.name:r.username), 'success');
  renderAdminTabContent();
}

async function rejectExcessRequest(reqId){
  if(isReadOnlyAdmin){ showToast('Режим только просмотра — изменения недоступны', 'danger'); return; }
  const r = DB.excessRequests.find(x=>x.id===reqId);
  if(!r || r.status!=='pending') return;
  r.status = 'rejected';
  r.resolvedBy = actingAdminUsername();
  r.resolvedAt = Date.now();
  addNotification(r.username, 'Ваш запрос сверх нормы на '+typeLabel(r.type)+' отклонён администратором');
  await saveDB();
  showToast('Запрос отклонён', 'success');
  renderAdminTabContent();
}

/* ================= INIT ================= */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState !== 'visible') return;
  if(currentRole==='employee'){
    await refreshFromStorage();
    const changed = processTempBlockExpirations();
    if(changed) await saveDB();
    if(!popupOpen) renderEmployee(); else maybeShowPopupForEmployee();
  } else if(currentRole==='admin'){
    await refreshFromStorage();
    const changed = processTempBlockExpirations();
    if(changed) await saveDB();
    if(!isAdminFormActive()){
      renderAdminTabContent();
    }
    updatePendingBadge();
  }
});

document.addEventListener('click', (e)=>{
  const dd = document.getElementById('bell-dropdown');
  const bellWrap = document.querySelector('.bell-wrap');
  if(dd && !dd.classList.contains('hidden') && bellWrap && !bellWrap.contains(e.target)){
    dd.classList.add('hidden');
  }
});

(async function init(){
  try{
    DB = await loadDB();
  }catch(e){
    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <div class="login-card" style="text-align:center;">
          <h1 class="login-title" style="color:var(--danger);">Не удалось подключиться</h1>
          <p class="login-sub">${escapeHtml(e.message || 'Ошибка соединения с базой данных.')}</p>
          <button class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="location.reload()">Обновить страницу</button>
        </div>
      </div>
    `;
    return;
  }
  processTempBlockExpirations();
  renderLogin();
  setupRealtimeSync();
})();
</script>
